name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: 3.9

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 pump_predictor/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 pump_predictor/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Check code formatting with black
        run: black --check pump_predictor/ tests/

      - name: Check import sorting with isort
        run: isort --check-only pump_predictor/ tests/

      - name: Type checking with mypy
        run: mypy pump_predictor/ --ignore-missing-imports

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov pytest-xdist

      - name: Create test data
        run: |
          python generate_dataset.py

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=pump_predictor --cov-report=xml --cov-report=html

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          pip install -r requirements.txt

      - name: Run Bandit security scan
        run: bandit -r pump_predictor/ -f json -o bandit-report.json

      - name: Check dependencies for vulnerabilities
        run: safety check --json --output safety-report.json

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  build-and-test-docker:
    name: Build and Test Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API Docker image
        run: |
          docker build -f deployment/docker/Dockerfile -t pump-predictor-api:test .

      - name: Build Dashboard Docker image
        run: |
          docker build -f deployment/docker/Dockerfile.dashboard -t pump-predictor-dashboard:test .

      - name: Test Docker containers
        run: |
          # Test API container
          docker run --rm -d --name api-test -p 8000:8000 pump-predictor-api:test &
          sleep 30
          curl -f http://localhost:8000/health || exit 1
          docker stop api-test

          # Test Dashboard container
          docker run --rm -d --name dashboard-test -p 8501:8501 pump-predictor-dashboard:test &
          sleep 30
          curl -f http://localhost:8501 || exit 1
          docker stop dashboard-test

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, security, build-and-test-docker]
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # This could include:
          # - Building and pushing Docker images
          # - Deploying to Kubernetes
          # - Running smoke tests

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          # Add smoke tests here
