apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-predictor-api
  labels:
    app: pump-predictor-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pump-predictor-api
  template:
    metadata:
      labels:
        app: pump-predictor-api
    spec:
      containers:
      - name: pump-predictor-api
        image: pump-predictor:latest
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: MODEL_PATH
          value: "/app/models"
        - name: LOG_LEVEL
          value: "INFO"
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: models-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: logs-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: pump-predictor-api-service
spec:
  selector:
    app: pump-predictor-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-predictor-dashboard
  labels:
    app: pump-predictor-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pump-predictor-dashboard
  template:
    metadata:
      labels:
        app: pump-predictor-dashboard
    spec:
      containers:
      - name: pump-predictor-dashboard
        image: pump-predictor-dashboard:latest
        ports:
        - containerPort: 8501
        env:
        - name: API_HOST
          value: "pump-predictor-api-service"
        - name: API_PORT
          value: "80"
        resources:
          requests:
            memory: "256Mi"
            cpu: "125m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: pump-predictor-dashboard-service
spec:
  selector:
    app: pump-predictor-dashboard
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer